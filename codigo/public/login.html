<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - TIAW</title>

  <!-- BOOTSTRAP -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- ICONES -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link href="css/style.css" rel="stylesheet">

  <style>

    body {

      margin: 0;
      padding: 0;

      background: #0f172a;

      font-family: "Inter", sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

    }

    .login-card {

      width: 100%;
      max-width: 420px;

      background: #111827;

      border: 1px solid #1f2937;

      border-radius: 18px;

      padding: 40px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.35);

    }

    .login-logo {

      width: 72px;
      height: 72px;

      background: #1f2937;

      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 20px auto;

      font-size: 30px;
      color: white;

    }

    .login-title {

      color: white;

      text-align: center;

      font-size: 28px;
      font-weight: 700;

      margin-bottom: 8px;

    }

    .login-subtitle {

      text-align: center;

      color: #9ca3af;

      margin-bottom: 32px;

      font-size: 14px;

    }

    .form-label {

      color: #d1d5db;

      font-size: 14px;

      margin-bottom: 8px;

    }

    .form-control {

      background: #1f2937 !important;

      border: 1px solid #374151 !important;

      color: white !important;

      height: 48px;

      border-radius: 12px;

    }

    .form-control::placeholder {

      color: #9ca3af;

    }

    .form-control:focus {

      box-shadow: none !important;

      border-color: #2563eb !important;

    }

    .btn-login {

      width: 100%;

      height: 48px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-weight: 600;

      transition: 0.3s;

      margin-top: 10px;

    }

    .btn-login:hover {

      background: #1d4ed8;

      transform: translateY(-2px);

    }

    .login-footer {

      text-align: center;

      margin-top: 24px;

      color: #9ca3af;

      font-size: 14px;

    }

    .login-footer a {

      color: #2563eb;

      text-decoration: none;

    }

  </style>

</head>

<body>

  <div class="login-card">

    <div class="login-logo">
      <i class="bi bi-shield-lock"></i>
    </div>

    <h1 class="login-title">
      TIAW
    </h1>

    <p class="login-subtitle">
      Sistema de Ocorrências Urbanas
    </p>

    <!-- EMAIL -->
    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="Digite seu email"
      >

    </div>

    <!-- SENHA -->
    <div class="mb-3">

      <label class="form-label">
        Senha
      </label>

      <input
        type="password"
        id="senha"
        class="form-control"
        placeholder="Digite sua senha"
      >

    </div>

    <!-- BOTÃO -->
    <button
      class="btn-login"
      onclick="login()"
    >
      Entrar
    </button>

    <div class="login-footer">

      Admin:
      admin@gmail.com

      <br><br>

      Usuário:
      aluno@gmail.com

    </div>

  </div>

  <!-- LOGIN JS -->
  <script src="js/login.js"></script>

  <!-- BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
