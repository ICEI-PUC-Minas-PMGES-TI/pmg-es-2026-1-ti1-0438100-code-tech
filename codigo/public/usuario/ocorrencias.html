<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Ocorrências - TIAW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="css/ocorrencias.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html">
              <i class="bi bi-house-door"></i>
              <span>Início</span>
            </a>
          </li>
          <li><a href="feed.html"><i class="bi bi-megaphone"></i><span>Feed da cidade</span></a></li>
          <li>
            <a href="ocorrencias.html" class="active">
              <i class="bi bi-list-ul"></i>
              <span>Minhas Ocorrências</span>
            </a>
          </li>
          <li>
            <a href="nova-ocorrencia.html">
              <i class="bi bi-plus-circle"></i>
              <span>Nova Ocorrência</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <a href="#" onclick="logout(event)">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input id="search-text" type="text" placeholder="Buscar por Endereço, bairro, tipo...">
        </div>
        <div class="top-bar-right">
          <div class="user-info">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-details">
              <div class="name" data-user-name>Usuário</div>
              <div class="role" data-user-role>Morador</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1>Minhas Ocorrências</h1>
            <p class="subtitle">Acompanhe suas solicitações enviadas</p>
          </div>
          <a href="nova-ocorrencia.html" class="btn-mongodb-primary">
            <i class="bi bi-plus-lg"></i> Nova Ocorrência
          </a>
        </div>
      </div>

      <div class="content-area">
        
        <div class="filter-box">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h3 style="margin: 0;">Filtros</h3>
            <a id="clear-filters" href="#" style="color: var(--action-blue); text-decoration: none; font-size: 13px; font-weight: 400;">Limpar filtros</a>
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label-mongodb">Tipo</label>
              <select id="filter-type" class="form-control-mongodb select-mongodb">
                <option value="todos">todos</option>
                <option value="Buraco">Buraco</option>
                <option value="Vazamento">Vazamento</option>
                <option value="Falta de Água">Falta de Água</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label-mongodb">Status</label>
              <select id="filter-status" class="form-control-mongodb select-mongodb">
                <option value="todos">todos</option>
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Resolvido">Resolvido</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label-mongodb">Bairro</label>
              <select id="filter-bairro" class="form-control-mongodb select-mongodb">
                <option value="todos">todos</option>
                <option value="Comiteco">Comiteco</option>
                <option value="Boa Viagem">Boa Viagem</option>
                <option value="Pantanal">Pantanal</option>
                <option value="Barreto">Barreto</option>
                <option value="Queiroz">Queiroz</option>
                <option value="Vila Rica">Vila Rica</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label-mongodb">Data inicial</label>
              <input id="filter-start" type="date" class="form-control-mongodb" placeholder="dd/mm/aaaa">
            </div>
            <div class="col-md-4">
              <label class="form-label-mongodb">Data final</label>
              <input id="filter-end" type="date" class="form-control-mongodb" placeholder="dd/mm/aaaa">
            </div>
            <div class="col-md-4">
              <label class="form-label-mongodb">Endereço</label>
              <input id="filter-address" type="text" class="form-control-mongodb" placeholder="Buscar por Endereço...">
            </div>
          </div>
        </div>

        <div class="card-mongodb" style="padding: 0; overflow: hidden;">
          <table class="table-mongodb">
            <thead>
              <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Endereço</th>
                <th>Bairro</th>
                <th>Data</th>
                <th>Status</th>
                <th>Prioridade</th>
                <th>Detalhes</th>
              </tr>
            </thead>
            <tbody id="ocorrencias-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/ocorrencias.js"></script>
</body>
</html>
