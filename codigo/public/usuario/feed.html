<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed da cidade | InfraBH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="css/feed.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li><a href="dashboard.html"><i class="bi bi-house-door"></i><span>Início</span></a></li>
          <li><a href="feed.html" class="active"><i class="bi bi-megaphone"></i><span>Feed da cidade</span></a></li>
          <li><a href="ocorrencias.html"><i class="bi bi-list-ul"></i><span>Minhas Ocorrências</span></a></li>
          <li><a href="nova-ocorrencia.html"><i class="bi bi-plus-circle"></i><span>Nova Ocorrência</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-bottom"><a href="#" onclick="logout(event)"><i class="bi bi-box-arrow-left"></i><span>Sair</span></a></div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div class="search-box"><i class="bi bi-search"></i><input id="feed-search" type="search" placeholder="Buscar no feed..."></div>
        <div class="top-bar-right">
          <div class="user-info"><div class="user-avatar"><i class="bi bi-person"></i></div><div class="user-details"><div class="name" data-user-name>Usuário</div><div class="role" data-user-role>Cidadão</div></div></div>
        </div>
      </div>

      <div class="page-header">
        <div class="page-header-row">
          <div><p class="leafy-label">Ocorrências verificadas</p><h1>Feed da <span class="accent-underline">cidade</span></h1><p class="subtitle">Aqui aparecem somente denúncias analisadas e aprovadas pela administração.</p></div>
          <a href="nova-ocorrencia.html" class="btn-mongodb-primary"><i class="bi bi-plus-lg"></i> Enviar denúncia</a>
        </div>
      </div>

      <div class="content-area">
        <div id="feed-summary" class="feed-summary"></div>
        <section id="feed-list" class="feed-grid" aria-live="polite"></section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
