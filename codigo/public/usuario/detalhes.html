<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Ocorrência - TIAW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="css/detalhes.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html">
              <i class="bi bi-house-door"></i>
              <span>Início</span>
            </a>
          </li>
          <li>
            <a href="ocorrencias.html">
              <i class="bi bi-list-ul"></i>
              <span>Minhas Ocorrências</span>
            </a>
          </li>
          <li>
            <a href="nova-ocorrencia.html">
              <i class="bi bi-plus-circle"></i>
              <span>Registrar Ocorrência</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <a href="#">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <a href="ocorrencias.html" class="back-link">
          <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <div class="top-bar-right">
          <div class="notification-bell">
            <i class="bi bi-bell"></i>
            <span class="badge-dot">4</span>
          </div>
          <div class="user-info">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-details">
              <div class="name">Usuário</div>
              <div class="role">Morador</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header">
        <h1>ID <span class="accent-underline" id="detail-id">#0000</span></h1>
      </div>

      <div class="content-area">
        
        <div class="detail-grid mb-4">
          
          <div class="card-mongodb" style="padding: 0; overflow: hidden;">
            <div style="width: 100%; height: 260px; background: var(--light-input); display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-image" style="font-size: 64px; color: var(--silver-teal);"></i>
            </div>
          </div>

          <div class="card-mongodb">
            <table class="detail-info-table">
              <tr>
                <td>Tipo:</td>
                <td id="detail-type"></td>
              </tr>
              <tr>
                <td>Endereço:</td>
                <td id="detail-address"></td>
              </tr>
              <tr>
                <td>Bairro:</td>
                <td id="detail-bairro"></td>
              </tr>
              <tr>
                <td>Data:</td>
                <td id="detail-date"></td>
              </tr>
              <tr>
                <td>Prioridade:</td>
                <td id="detail-priority"></td>
              </tr>
              <tr>
                <td>Status:</td>
                <td id="detail-status"></td>
              </tr>
              <tr>
                <td>Reportado por:</td>
                <td id="detail-reported"></td>
              </tr>
            </table>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-4">
            <div class="image-gallery">
              <div class="thumb" style="display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-image" style="color: var(--silver-teal);"></i>
              </div>
              <div class="thumb" style="display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-image" style="color: var(--silver-teal);"></i>
              </div>
              <div class="thumb" style="display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-image" style="color: var(--silver-teal);"></i>
              </div>
            </div>
          </div>
          <div class="col-md-8">
            <div class="description-box">
              <h4>Descrição</h4>
              <p id="detail-description"></p>
            </div>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <h4 style="font-size: 16px; font-weight: 500; text-align: center; margin-bottom: 12px; color: var(--forest-black);">Localização</h4>
            <div class="map-container" style="height: 240px;">
              <div style="text-align: center; color: var(--cool-gray);">
                <i class="bi bi-geo-alt-fill" style="font-size: 36px; display: block; margin-bottom: 8px;"></i>
                <span id="detail-location" style="font-size: 13px;"></span>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="history-box" style="height: 100%;">
              <h4>Histórico</h4>
              <div id="detail-history"></div>
            </div>
          </div>
        </div>

        <div class="d-flex gap-3 justify-content-center" style="padding: 16px 0 32px;">
          <button id="btn-cancel-occurrence" class="btn-mongodb-danger" style="border-radius: 100px; padding: 12px 32px; font-size: 15px;">
            Cancelar solicitação
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/detalhes.js"></script>
</body>
</html>
