<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrência - TIAW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link href="../css/style.css" rel="stylesheet">
  <link href="css/nova-ocorrencia.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html">
              <i class="bi bi-house-door"></i>
              <span>Início</span>
            </a>
          </li>
          <li>
            <a href="ocorrencias.html">
              <i class="bi bi-list-ul"></i>
              <span>Minhas Ocorrências</span>
            </a>
          </li>
          <li>
            <a href="nova-ocorrencia.html" class="active">
              <i class="bi bi-plus-circle"></i>
              <span>Nova Ocorrência</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <a href="#">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <a href="ocorrencias.html" class="back-link">
          <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <div class="top-bar-right">
          <div class="notification-bell">
            <i class="bi bi-bell"></i>
            <span class="badge-dot">4</span>
          </div>
          <div class="user-info">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-details">
              <div class="name">Usuário</div>
              <div class="role">Morador</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header">
        <h1>Nova Ocorrência</h1>
      </div>

      <div class="content-area">
        <div class="card-mongodb" style="max-width: 700px;">
          <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 20px; color: var(--forest-black);">
            Localização da Ocorrência
          </h3>

          <div class="mb-3">
            <label class="form-label-mongodb">Endereço:</label>
            <div class="d-flex gap-2">
              <input id="input-address" type="text" class="form-control-mongodb" placeholder="Rua Timbiras, 150 - Funcionários" style="flex: 1;">
              <button id="btn-search-address" type="button" class="btn-mongodb-primary" style="border-radius: 8px; white-space: nowrap;">
                Buscar Endereço
              </button>
            </div>
          </div>
          <input type="hidden" id="input-lat" value="-19.920000">
          <input type="hidden" id="input-lng" value="-43.940000">

          <div class="mb-3">
            <label class="form-label-mongodb">Mapa de localização</label>
            <div id="ocorrencia-map" class="map-container" style="height: 280px; border-radius: 12px;"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Bairro:</label>
            <input id="input-bairro" type="text" class="form-control-mongodb" placeholder="Digite o bairro" />
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Tipo:</label>
            <select id="input-type" class="form-control-mongodb select-mongodb">
              <option>Buraco</option>
              <option>Vazamento</option>
              <option>Falta de Água</option>
              <option>Outros</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Prioridade:</label>
            <select id="input-priority" class="form-control-mongodb select-mongodb">
              <option>Baixa</option>
              <option>Média</option>
              <option>Alta</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Descrição:</label>
            <textarea id="input-description" class="form-control-mongodb" rows="4" placeholder="Descreva a Ocorrência em detalhes..." style="resize: vertical;"></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label-mongodb">Fotos:</label>
            <div id="photo-upload-area" style="border: 2px dashed var(--silver-teal); border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--dark-green)'" onmouseout="this.style.borderColor='var(--silver-teal)';">
              <i class="bi bi-cloud-arrow-up" style="font-size: 32px; color: var(--cool-gray); display: block; margin-bottom: 8px;"></i>
              <span style="font-size: 14px; color: var(--cool-gray);">Arraste fotos aqui ou clique para enviar</span>
            </div>
            <input id="input-photos" type="file" accept="image/*" multiple hidden>
            <div id="photo-preview" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;"></div>
          </div>

          <div class="d-flex gap-3">
            <button id="btn-register-occurrence" type="button" class="btn-mongodb-primary" style="flex: 1; justify-content: center;">
              <i class="bi bi-check-lg"></i> Nova Ocorrência
            </button>
            <a href="ocorrencias.html" class="btn-mongodb-outline" style="flex: 0;">
              Cancelar
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/nova-ocorrencia.js"></script>
</body>
</html>
