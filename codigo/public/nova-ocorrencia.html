<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  >

  <title>
    Nova Ocorrencia - TIAW
  </title>

  <link
    href="
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
    "
    rel="stylesheet"
  >

  <link
    href="
      https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css
    "
    rel="stylesheet"
  >

  <link
    href="
      https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap
    "
    rel="stylesheet"
  >

  <link
    href="css/style.css"
    rel="stylesheet"
  >

</head>

<body>

  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <nav>

        <ul class="sidebar-nav">

          <li>

            <a href="dashboard-admin.html">

              <i class="bi bi-grid-1x2"></i>

              <span>
                Dashboard
              </span>

            </a>

          </li>

          <li>

            <a href="ocorrencias.html">

              <i class="bi bi-list-ul"></i>

              <span>
                Ocorrencias
              </span>

            </a>

          </li>

          <li>

            <a href="relatorios.html">

              <i class="bi bi-bar-chart-line"></i>

              <span>
                Relatorios
              </span>

            </a>

          </li>

          <li>

            <a
              href="nova-ocorrencia.html"
              class="active"
            >

              <i class="bi bi-plus-circle"></i>

              <span>
                Nova Ocorrencia
              </span>

            </a>

          </li>

          <li>

            <a href="detalhes.html">

              <i class="bi bi-file-earmark-text"></i>

              <span>
                Detalhes
              </span>

            </a>

          </li>

        </ul>

      </nav>

      <div class="sidebar-bottom">

        <a href="#">

          <i class="bi bi-box-arrow-left"></i>

          <span>
            Sair
          </span>

        </a>

      </div>

    </aside>

    <!-- CONTEUDO -->
    <main class="main-content">

      <!-- TOPO -->
      <div class="top-bar">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>

        <a
          href="ocorrencias.html"
          class="back-link"
        >

          <i class="bi bi-arrow-left"></i>

          Voltar

        </a>

      </div>

      <!-- TITULO -->
      <div class="page-header">

        <h1>
          Nova Ocorrência
        </h1>

      </div>

      <!-- FORMULARIO -->
      <div class="content-area">

        <div
          class="card-mongodb"
          style="max-width: 700px;"
        >

          <h3
            style="
              font-size: 18px;
              font-weight: 500;
              margin-bottom: 20px;
            "
          >

            Cadastro de Ocorrência

          </h3>

          <!-- ENDERECO -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Endereço:

            </label>

            <input
              type="text"
              id="endereco"
              class="form-control-mongodb"
              placeholder="
                Digite o endereço
              "
            >

          </div>

          <!-- BAIRRO -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Bairro:

            </label>

            <input
              type="text"
              id="bairro"
              class="form-control-mongodb"
              placeholder="
                Digite o bairro
              "
            >

          </div>

          <!-- TIPO -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Tipo:

            </label>

            <input
  type="hidden"
  id="tipo"
  value="Buraco"
>

<div class="dropdown filtro-dropdown">

  <button
    class="form-control-mongodb dropdown-toggle text-start"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
    id="textoTipo"
  >
    Buraco
  </button>

  <ul class="dropdown-menu filtro-menu">

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarTipoNova('Buraco', 'Buraco')"
      >
        Buraco
      </button>
    </li>

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarTipoNova('Vazamento', 'Vazamento')"
      >
        Vazamento
      </button>
    </li>

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarTipoNova('Falta de Água', 'Falta de Água')"
      >
        Falta de Água
      </button>
    </li>

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarTipoNova('Outros', 'Outros')"
      >
        Outros
      </button>
    </li>

  </ul>

</div> 

          </div>

          <!-- PRIORIDADE -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Prioridade:

            </label>

            <input
  type="hidden"
  id="prioridade"
  value="Baixa"
>

<div class="dropdown filtro-dropdown">

  <button
    class="form-control-mongodb dropdown-toggle text-start"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
    id="textoPrioridade"
  >
    Baixa
  </button>

  <ul class="dropdown-menu filtro-menu">

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarPrioridadeNova('Baixa', 'Baixa')"
      >
        Baixa
      </button>
    </li>

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarPrioridadeNova('Média', 'Média')"
      >
        Média
      </button>
    </li>

    <li>
      <button
        class="dropdown-item"
        type="button"
        onclick="selecionarPrioridadeNova('Alta', 'Alta')"
      >
        Alta
      </button>
    </li>

  </ul>

</div>

          </div>

          <!-- DESCRICAO -->
          <div class="mb-4">

            <label class="form-label-mongodb">

              Descrição:

            </label>

            <textarea
              id="descricao"
              class="form-control-mongodb"
              rows="4"
              placeholder="
                Descreva a ocorrência...
              "
              style="resize: vertical;"
            ></textarea>

          </div>

          <!-- BOTOES -->
          <div class="d-flex gap-3">

            <button
              id="btnCadastrar"
              class="btn-mongodb-primary"
              style="
                flex: 1;
                justify-content: center;
              "
            >

              <i class="bi bi-check-lg"></i>

              Registrar Ocorrência

            </button>

            <a
              href="ocorrencias.html"
              class="btn-mongodb-outline"
            >

              Cancelar

            </a>

          </div>

        </div>

      </div>

    </main>

  </div>

 <script src="js/nova-ocorrencia.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
