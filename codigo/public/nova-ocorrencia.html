<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  >

  <title>
    Nova Ocorrencia - TIAW
  </title>

  <link
    href="
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
    "
    rel="stylesheet"
  >

  <link
    href="
      https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css
    "
    rel="stylesheet"
  >

  <link
    href="
      https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap
    "
    rel="stylesheet"
  >

  <link
    href="css/style.css"
    rel="stylesheet"
  >

</head>

<body>

  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <nav>

        <ul class="sidebar-nav">

          <li>

            <a href="dashboard.html">

              <i class="bi bi-grid-1x2"></i>

              <span>
                Dashboard
              </span>

            </a>

          </li>

          <li>

            <a href="ocorrencias.html">

              <i class="bi bi-list-ul"></i>

              <span>
                Ocorrencias
              </span>

            </a>

          </li>

          <li>

            <a href="relatorios.html">

              <i class="bi bi-bar-chart-line"></i>

              <span>
                Relatorios
              </span>

            </a>

          </li>

          <li>

            <a
              href="nova-ocorrencia.html"
              class="active"
            >

              <i class="bi bi-plus-circle"></i>

              <span>
                Nova Ocorrencia
              </span>

            </a>

          </li>

          <li>

            <a href="detalhes.html">

              <i class="bi bi-file-earmark-text"></i>

              <span>
                Detalhes
              </span>

            </a>

          </li>

        </ul>

      </nav>

      <div class="sidebar-bottom">

        <a href="#">

          <i class="bi bi-box-arrow-left"></i>

          <span>
            Sair
          </span>

        </a>

      </div>

    </aside>

    <!-- CONTEUDO -->
    <main class="main-content">

      <!-- TOPO -->
      <div class="top-bar">

        <a
          href="ocorrencias.html"
          class="back-link"
        >

          <i class="bi bi-arrow-left"></i>

          Voltar

        </a>

      </div>

      <!-- TITULO -->
      <div class="page-header">

        <h1>
          Nova Ocorrência
        </h1>

      </div>

      <!-- FORMULARIO -->
      <div class="content-area">

        <div
          class="card-mongodb"
          style="max-width: 700px;"
        >

          <h3
            style="
              font-size: 18px;
              font-weight: 500;
              margin-bottom: 20px;
            "
          >

            Cadastro de Ocorrência

          </h3>

          <!-- ENDERECO -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Endereço:

            </label>

            <input
              type="text"
              id="endereco"
              class="form-control-mongodb"
              placeholder="
                Digite o endereço
              "
            >

          </div>

          <!-- BAIRRO -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Bairro:

            </label>

            <input
              type="text"
              id="bairro"
              class="form-control-mongodb"
              placeholder="
                Digite o bairro
              "
            >

          </div>

          <!-- TIPO -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Tipo:

            </label>

            <select
              id="tipo"
              class="
                form-control-mongodb
                select-mongodb
              "
            >

              <option value="Buraco">
                Buraco
              </option>

              <option value="Vazamento">
                Vazamento
              </option>

              <option value="Falta de Água">
                Falta de Água
              </option>

              <option value="Outros">
                Outros
              </option>

            </select>

          </div>

          <!-- PRIORIDADE -->
          <div class="mb-3">

            <label class="form-label-mongodb">

              Prioridade:

            </label>

            <select
              id="prioridade"
              class="
                form-control-mongodb
                select-mongodb
              "
            >

              <option value="Baixa">
                Baixa
              </option>

              <option value="Média">
                Média
              </option>

              <option value="Alta">
                Alta
              </option>

            </select>

          </div>

          <!-- DESCRICAO -->
          <div class="mb-4">

            <label class="form-label-mongodb">

              Descrição:

            </label>

            <textarea
              id="descricao"
              class="form-control-mongodb"
              rows="4"
              placeholder="
                Descreva a ocorrência...
              "
              style="resize: vertical;"
            ></textarea>

          </div>

          <!-- BOTOES -->
          <div class="d-flex gap-3">

            <button
              id="btnCadastrar"
              class="btn-mongodb-primary"
              style="
                flex: 1;
                justify-content: center;
              "
            >

              <i class="bi bi-check-lg"></i>

              Registrar Ocorrência

            </button>

            <a
              href="ocorrencias.html"
              class="btn-mongodb-outline"
            >

              Cancelar

            </a>

          </div>

        </div>

      </div>

    </main>

  </div>

  <!-- JS -->
  <script src="nova-ocorrencia.js"></script>

  <script
    src="
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
    "
  ></script>

</body>

</html>
