<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova Ocorrência - TIAW</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <div
    class="offcanvas offcanvas-start offcanvas-sidebar d-lg-none"
    tabindex="-1"
    id="sidebarMobile"
  >
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">InfraBH</h5>

      <button
        type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="offcanvas"
        aria-label="Fechar"
      ></button>
    </div>

    <div class="offcanvas-body p-0">
      <nav>
        <ul class="sidebar-nav">

          <li>
            <a href="dashboard-admin.html">
              <i class="bi bi-grid-1x2"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li>
            <a href="ocorrencias.html">
              <i class="bi bi-list-ul"></i>
              <span>Ocorrências</span>
            </a>
          </li>

          <li>
            <a href="relatorios.html">
              <i class="bi bi-bar-chart-line"></i>
              <span>Relatórios</span>
            </a>
          </li>

          <li>
            <a href="nova-ocorrencia.html" class="active">
              <i class="bi bi-plus-circle"></i>
              <span>Nova Ocorrência</span>
            </a>
          </li>

          <li>
            <a href="detalhes.html">
              <i class="bi bi-file-earmark-text"></i>
              <span>Detalhes</span>
            </a>
          </li>

        </ul>
      </nav>
    </div>
  </div>

  <div class="app-layout">

    <aside class="sidebar d-none d-lg-flex">
      <nav>
        <ul class="sidebar-nav">

          <li>
            <a href="dashboard-admin.html">
              <i class="bi bi-grid-1x2"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li>
            <a href="ocorrencias.html">
              <i class="bi bi-list-ul"></i>
              <span>Ocorrências</span>
            </a>
          </li>

          <li>
            <a href="relatorios.html">
              <i class="bi bi-bar-chart-line"></i>
              <span>Relatórios</span>
            </a>
          </li>

          <li>
            <a href="nova-ocorrencia.html" class="active">
              <i class="bi bi-plus-circle"></i>
              <span>Nova Ocorrência</span>
            </a>
          </li>

          <li>
            <a href="detalhes.html">
              <i class="bi bi-file-earmark-text"></i>
              <span>Detalhes</span>
            </a>
          </li>

        </ul>
      </nav>

      <div class="sidebar-bottom">
        <a href="#">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">

      <div class="top-bar d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-3">

        <button
          class="mobile-menu-btn d-inline-flex d-lg-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebarMobile"
          aria-controls="sidebarMobile"
        >
          <i class="bi bi-list"></i>
        </button>

        <a href="ocorrencias.html" class="back-link">
          <i class="bi bi-arrow-left"></i>
          Voltar
        </a>

      </div>

      <div class="page-header">
        <h1>Nova Ocorrência</h1>
      </div>

      <div class="content-area">

        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">

            <div class="card-mongodb">

              <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 20px;">
                Cadastro de Ocorrência
              </h3>

              <div class="row g-3">

                <div class="col-12">
                  <label class="form-label-mongodb">Endereço:</label>
                  <input
                    type="text"
                    id="endereco"
                    class="form-control-mongodb"
                    placeholder="Digite o endereço"
                  >
                </div>

                <div class="col-12">
                  <label class="form-label-mongodb">Bairro:</label>
                  <input
                    type="text"
                    id="bairro"
                    class="form-control-mongodb"
                    placeholder="Digite o bairro"
                  >
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label-mongodb">Tipo:</label>
                  <select id="tipo" class="form-control-mongodb">
                    <option value="Buraco">Buraco</option>
                    <option value="Vazamento">Vazamento</option>
                    <option value="Falta de Água">Falta de Água</option>
                    <option value="Outros">Outros</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label-mongodb">Prioridade:</label>
                  <select id="prioridade" class="form-control-mongodb">
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label-mongodb">Descrição:</label>
                  <textarea
                    id="descricao"
                    class="form-control-mongodb"
                    rows="4"
                    placeholder="Descreva a ocorrência..."
                    style="resize: vertical;"
                  ></textarea>
                </div>

                <div class="col-12">
                  <div class="d-flex flex-column flex-md-row gap-3">

                    <button
                      id="btnCadastrar"
                      class="btn-mongodb-primary flex-fill justify-content-center"
                      type="button"
                    >
                      <i class="bi bi-check-lg"></i>
                      Registrar Ocorrência
                    </button>

                    <a
                      href="ocorrencias.html"
                      class="btn-mongodb-outline flex-fill justify-content-center"
                    >
                      Cancelar
                    </a>

                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>

      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
