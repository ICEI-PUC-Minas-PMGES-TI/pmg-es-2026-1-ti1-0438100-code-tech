<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrencia - TIAW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html">
              <i class="bi bi-grid-1x2"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="ocorrencias.html">
              <i class="bi bi-list-ul"></i>
              <span>Ocorrencias</span>
            </a>
          </li>
          <li>
            <a href="relatorios.html">
              <i class="bi bi-bar-chart-line"></i>
              <span>Relatarios</span>
            </a>
          </li>
          <li>
            <a href="nova-ocorrencia.html" class="active">
              <i class="bi bi-plus-circle"></i>
              <span>Nova Ocorrencia</span>
            </a>
          </li>
          <li>
            <a href="detalhes.html">
              <i class="bi bi-file-earmark-text"></i>
              <span>Detalhes</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <a href="#">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <a href="ocorrencias.html" class="back-link">
          <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <div class="top-bar-right">
          <div class="notification-bell">
            <i class="bi bi-bell"></i>
            <span class="badge-dot">4</span>
          </div>
          <div class="user-info">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-details">
              <div class="name">Admin</div>
              <div class="role">Administrador</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header">
        <h1>Nova Ocorrência</h1>
      </div>

      <div class="content-area">
        <div class="card-mongodb" style="max-width: 700px;">
          <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 20px; color: var(--forest-black);">
            Localização da Ocorrência
          </h3>

          <div class="map-container mb-4" style="height: 280px; border-radius: 12px;">
            <div style="text-align: center; color: var(--cool-gray);">
              <i class="bi bi-geo-alt-fill" style="font-size: 48px; display: block; margin-bottom: 8px;"></i>
              <span>Clique no mapa para selecionar a localização</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Endereço:</label>
            <div class="d-flex gap-2">
              <input type="text" class="form-control-mongodb" placeholder="Rua Timbiras, 150 - Funcionaram" style="flex: 1;">
              <button class="btn-mongodb-primary" style="border-radius: 8px; white-space: nowrap;">
                Buscar Endereço
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Tipo:</label>
            <select class="form-control-mongodb select-mongodb">
              <option>Buraco</option>
              <option>Vazamento</option>
              <option>Falta de Água</option>
              <option>Outros</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Prioridade:</label>
            <select class="form-control-mongodb select-mongodb">
              <option>Baixa</option>
              <option>Média</option>
              <option>Alta</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label-mongodb">Descrição:</label>
            <textarea class="form-control-mongodb" rows="4" placeholder="Descreva a Ocorrência em detalhes..." style="resize: vertical;"></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label-mongodb">Fotos:</label>
            <div style="border: 2px dashed var(--silver-teal); border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--dark-green)'" onmouseout="this.style.borderColor='var(--silver-teal)'">
              <i class="bi bi-cloud-arrow-up" style="font-size: 32px; color: var(--cool-gray); display: block; margin-bottom: 8px;"></i>
              <span style="font-size: 14px; color: var(--cool-gray);">Arraste fotos aqui ou clique para enviar</span>
            </div>
          </div>

          <div class="d-flex gap-3">
            <button class="btn-mongodb-primary" style="flex: 1; justify-content: center;">
              <i class="bi bi-check-lg"></i> Registrar Ocorrência
            </button>
            <a href="ocorrencias.html" class="btn-mongodb-outline" style="flex: 0;">
              Cancelar
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
