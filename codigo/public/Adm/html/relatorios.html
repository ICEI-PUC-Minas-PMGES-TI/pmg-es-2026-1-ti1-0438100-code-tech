<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relátorios - TIAW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-page="relatorios">
  <div class="app-layout">
    
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html">
              <i class="bi bi-grid-1x2"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="ocorrencias.html">
              <i class="bi bi-list-ul"></i>
              <span>Ocorrências</span>
            </a>
          </li>
          <li>
            <a href="relatorios.html" class="active">
              <i class="bi bi-bar-chart-line"></i>
              <span>Relátorios</span>
            </a>
          </li>
          <li>
            <a href="aprovacoes.html">
              <i class="bi bi-shield-check"></i>
              <span>Aprovações</span>
            </a>
          </li>
          <li>
            <a href="detalhes.html">
              <i class="bi bi-file-earmark-text"></i>
              <span>Detalhes</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <a href="#" onclick="logout(event)">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Buscar por Endereço, bairro, tipo...">
        </div>
        <div class="top-bar-right">
          <div class="user-info">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-details">
              <div class="name" data-user-name>Admin</div>
              <div class="role" data-user-role>Administrador</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1>Relátorios</h1>
            <p class="subtitle">Análise e estatástica das Ocorrências</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <select class="dropdown-mongodb">
              <option>Últimos 30 dias</option>
              <option>Últimos 7 dias</option>
              <option>Últimos 90 dias</option>
            </select>
            <button class="btn-mongodb-primary">
              <i class="bi bi-download"></i> Exportar
            </button>
          </div>
        </div>
      </div>

      <div class="content-area">
        
        <div class="row g-3 mb-4">
          <div class="col-md-3 col-6">
            <div class="stat-card">
              <div class="stat-label">Total</div>
              <div class="stat-value" id="report-total">0</div>
              <div class="stat-percent">Ocorrências</div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="stat-card">
              <div class="stat-label">Resolvidos</div>
              <div class="stat-value" id="report-resolved">0</div>
              <div class="stat-percent" id="report-resolved-percent">0%</div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="stat-card">
              <div class="stat-label">Buracos</div>
              <div class="stat-value" id="report-buracos">0</div>
              <div class="stat-percent" id="report-buracos-percent">0%</div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="stat-card">
              <div class="stat-label">Bairros</div>
              <div class="stat-value" id="report-bairros">0</div>
              <div class="stat-percent">Com ocorrências</div>
            </div>
          </div>
        </div>

        <div class="row g-4 mb-4">
          
          <div class="col-md-6">
            <div class="card-mongodb">
              <h3 style="font-size: 16px; font-weight: 500; margin-bottom: 20px;">Ocorrências por tipo</h3>
              <div class="chart-container" style="height: 280px; display: flex; align-items: center; justify-content: center;">
                <canvas id="doughnutChart"></canvas>
              </div>
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="card-mongodb">
              <h3 style="font-size: 16px; font-weight: 500; margin-bottom: 20px;">Ocorrências por bairro</h3>
              <div class="chart-container" style="height: 280px;">
                <canvas id="barChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="card-mongodb mb-4">
          <h3 style="font-size: 16px; font-weight: 500; margin-bottom: 20px;">Evolução das Ocorrências</h3>
          <div class="row">
            <div class="col-md-5">
              <div class="chart-container" style="height: 250px;">
                <canvas id="horizontalBarChart"></canvas>
              </div>
            </div>
            <div class="col-md-7">
              <div class="chart-container" style="height: 250px;">
                <canvas id="lineChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../usuario/js/relatorios.js?v=2"></script>
</body>
</html>
