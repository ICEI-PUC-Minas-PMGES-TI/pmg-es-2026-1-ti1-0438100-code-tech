<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrências - TIAW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    
    <aside class="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html">
              <i class="bi bi-grid-1x2"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="ocorrencias.html" class="active">
              <i class="bi bi-list-ul"></i>
              <span>Ocorrências</span>
            </a>
          </li>
          <li>
            <a href="relatorios.html">
              <i class="bi bi-bar-chart-line"></i>
              <span>Relátorios</span>
            </a>
          </li>
          <li>
            <a href="nova-ocorrencia.html">
              <i class="bi bi-plus-circle"></i>
              <span>Nova Ocorrência</span>
            </a>
          </li>
          <li>
            <a href="detalhes.html">
              <i class="bi bi-file-earmark-text"></i>
              <span>Detalhes</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <a href="#">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      
      <div class="top-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Buscar por Endereço, bairro, tipo...">
        </div>
        <div class="top-bar-right">
          <div class="notification-bell">
            <i class="bi bi-bell"></i>
            <span class="badge-dot">4</span>
          </div>
          <div class="user-info">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-details">
              <div class="name">Admin</div>
              <div class="role">Administrador</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1>Ocorrências</h1>
            <p class="subtitle">Gerencie todas as Ocorrências reportadas</p>
          </div>
          <a href="nova-ocorrencia.html" class="btn-mongodb-primary">
            <i class="bi bi-plus-lg"></i> Novas Ocorrências
          </a>
        </div>
      </div>

      <div class="content-area">
        
        <div class="filter-box">

  <div class="d-flex align-items-center justify-content-between mb-3">

    <h3 style="margin: 0;">
      Filtros
    </h3>

    <button
      class="btn btn-outline-secondary btn-sm"
      onclick="limparFiltros()"
    >
      Limpar filtros
    </button>

  </div>

  <div class="row g-3">

    <div class="col-md-4">

      <label class="form-label-mongodb">
        Tipo
      </label>

      <select
        id="filtroTipo"
        class="form-control-mongodb select-mongodb"
      >

        <option value="">
          Todos
        </option>

        <option value="Buraco">
          Buraco
        </option>

        <option value="Vazamento">
          Vazamento
        </option>

        <option value="Falta de Água">
          Falta de Água
        </option>

      </select>

    </div>

    <div class="col-md-4">

      <label class="form-label-mongodb">
        Status
      </label>

      <select
        id="filtroStatus"
        class="form-control-mongodb select-mongodb"
      >

        <option value="">
          Todos
        </option>

        <option value="Pendente">
          Pendente
        </option>

        <option value="Em andamento">
          Em andamento
        </option>

        <option value="Resolvido">
          Resolvido
        </option>

      </select>

    </div>

    <div class="col-md-4">

      <label class="form-label-mongodb">
        Bairro
      </label>

      <input
        type="text"
        id="filtroBairro"
        class="form-control-mongodb"
        placeholder="Digite o bairro"
      >

    </div>

    <div class="col-md-12">

      <button
        class="btn-mongodb-primary"
        onclick="filtrarOcorrencias()"
      >

        <i class="bi bi-funnel"></i>

        Filtrar

      </button>

    </div>

  </div>

</div>

        <div class="card-mongodb" style="padding: 0; overflow: hidden;">
          <table class="table-mongodb">

            <thead>

              <tr>

                <th>ID</th>
                <th>Tipo</th>
                <th>Endereço</th>
                <th>Bairro</th>
                <th>Data</th>
                <th>Status</th>
                <th>Prioridade</th>
                <th>Ações</th>

              </tr>

            </thead>

            <tbody id="tabelaOcorrencias">

            </tbody>

          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="ocorrencias.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
