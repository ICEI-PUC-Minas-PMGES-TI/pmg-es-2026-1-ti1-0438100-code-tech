<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InfraBH</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR SUPERIOR -->

  <nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand fw-bold" href="#">
      InfraBH
    </a>

    <div class="text-white">
      Administrador 👤
    </div>

  </nav>

  <!-- LAYOUT -->

  <div class="d-flex">

    <!-- SIDEBAR -->

    <div
      class="bg-secondary text-white p-3"
      style="width: 250px; min-height: 100vh;"
    >

      <h4 class="mb-4">Menu</h4>

      <ul class="nav flex-column gap-2">

        <li class="nav-item">
          <a href="#" class="nav-link text-white">
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link text-white">
            Ocorrências
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link text-white">
            Relatórios
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link text-white">
            Nova Ocorrência
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link text-white">
            Detalhes
          </a>
        </li>

      </ul>

    </div>

    <!-- CONTEÚDO -->

    <div class="container p-4">

      <!-- Título -->

      <div class="mb-4">

        <h1 class="fw-bold">
          Registro de Problemas Urbanos
        </h1>

        <p class="text-secondary">
          Sistema de gerenciamento de ocorrências.
        </p>

      </div>

      <!-- FORMULÁRIO -->

      <div class="card shadow p-4 mb-4">

        <h3 class="mb-4">
          Cadastrar Ocorrência
        </h3>

        <div class="row g-3">

          <div class="col-md-4">

            <input
              type="text"
              id="titulo"
              class="form-control"
              placeholder="Título do problema"
            >

          </div>

          <div class="col-md-4">

            <input
              type="text"
              id="descricao"
              class="form-control"
              placeholder="Descrição"
            >

          </div>

          <div class="col-md-4">

            <select id="categoria" class="form-select">

              <option value="1">
                Buraco
              </option>

              <option value="2">
                Vazamento
              </option>

              <option value="3">
                Rachadura
              </option>

            </select>

          </div>

        </div>

        <div class="mt-4 d-flex gap-2">

          <button
            onclick="adicionar()"
            class="btn btn-success"
          >
            Adicionar
          </button>

          <button
            onclick="mostrarTodos()"
            class="btn btn-primary"
          >
            Mostrar Todos
          </button>

        </div>

      </div>

      <!-- FILTROS -->

      <div class="card shadow p-4 mb-4">

        <h3 class="mb-3">
          Filtrar Ocorrências
        </h3>

        <div class="d-flex gap-2 flex-wrap">

          <button
            onclick="filtrar(1)"
            class="btn btn-dark"
          >
            Buracos
          </button>

          <button
            onclick="filtrar(2)"
            class="btn btn-info"
          >
            Vazamentos
          </button>

          <button
            onclick="filtrar(3)"
            class="btn btn-danger"
          >
            Rachaduras
          </button>

        </div>

      </div>

      <!-- LISTA -->

      <div class="card shadow p-4">

        <h3 class="mb-4">
          Lista de Problemas
        </h3>

        <ul
          id="lista"
          class="list-group"
        ></ul>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->

  <script src="script.js"></script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>

</html>
