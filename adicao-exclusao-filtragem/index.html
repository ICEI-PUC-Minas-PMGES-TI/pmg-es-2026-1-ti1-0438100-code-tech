  <br><br>

  <button onclick="mostrarTodos()">Mostrar todos</button>

  <h2>Filtrar</h2>

  <button onclick="filtrar(2)">Vazamentos</button>
  <button onclick="filtrar(3)">Rachaduras</button>

  <h2>Lista de Problemas</h2>
  <ul id="lista"></ul>

  <script src="script.js"></script>
